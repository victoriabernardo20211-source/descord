appId: app.nexus.desktop
productName: Nexus
copyright: Nexus
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
# O Olm carrega um .wasm em tempo de execução; dentro do asar ele não é lido.
asarUnpack:
  - '**/node_modules/@matrix-org/olm/**'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  artifactName: Nexus-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nexus
# Feed de atualização servido pelo próprio servidor, atrás do Tailscale.
# Defina NEXUS_UPDATE_URL antes de gerar o instalador — o endereço vai gravado
# dentro do executável, e é dele que cada cliente vai buscar as versões novas.
publish:
  provider: generic
  url: ${env.NEXUS_UPDATE_URL}
  # `release:windows` gera os arquivos localmente; a publicação é uma cópia
  # para o servidor, feita pelo scripts/publish-update.sh.
